{% extends "base.html" %}

{% block title %}Eliminar noticia{% endblock %}

{% block content %}
<section class="formulario">
    <h1>Eliminar noticia</h1>
    <p>¿Seguro que quieres eliminar “{{ object.titulo }}”?</p>

    <form method="post">
        {% csrf_token %}
        <div class="acciones">
            <button class="boton peligro" type="submit">Sí, eliminar</button>
            <a class="boton secundario" href="{% url 'noticia-detail' object.pk %}">
                Cancelar
            </a>
        </div>
    </form>
</section>
{% endblock %}
